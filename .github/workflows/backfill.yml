name: Historie-Backfill (bis Feb 2024)

# Läuft dreimal täglich, bis die komplette Preishistorie seit 2024-02-08
# nachgeladen ist; danach beendet sich jeder Lauf sofort ("nichts zu tun").
# Kann im Actions-Tab auch manuell gestartet werden.

on:
  schedule:
    - cron: "15 2,8,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip

      - name: Abhängigkeiten installieren
        # requirements-optional.txt enthält py7zr/brotli. In Actions (Python
        # 3.12.7) existieren dafür Wheels; lokal auf sehr neuen Python-Versionen
        # nicht, deshalb sind sie in einer eigenen Datei.
        run: pip install -r requirements.txt -r requirements-optional.txt

      - name: Archivtage nachladen
        run: python scripts/backfill_archive.py --days 150

      - name: Indizes neu berechnen
        run: python scripts/build_indices.py

      - name: Risikokennzahlen aktualisieren
        run: python scripts/build_risk.py

      - name: Daten validieren (bricht bei Fehlern ab)
        run: python scripts/validate_data.py --strict

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git commit -m "Backfill $(date -u +%FT%H:%M)" || { echo "nichts zu committen"; exit 0; }
          bash .github/push_mit_wiederholung.sh
      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages veröffentlichen
        uses: actions/deploy-pages@v4

      - name: Fehlermeldung per E-Mail
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py "Historie-Backfill fehlgeschlagen"
