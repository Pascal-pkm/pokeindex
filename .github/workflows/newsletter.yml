name: Sonntags-Wochenbriefing

on:
  schedule:
    - cron: "0 7 * * 0"   # jeden Sonntag 07:00 UTC (09:00 MESZ / 08:00 MEZ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Wochenbriefing erstellen und versenden
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
        run: python scripts/send_newsletter.py --mode weekly

      - name: Archiv committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/newsletter site/data/newsletters.js
          git commit -m "Wochenbriefing $(date -u +%F)" || echo "nichts zu committen"
          git push
