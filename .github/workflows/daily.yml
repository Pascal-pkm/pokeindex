name: Täglicher Datenabzug + Deploy

on:
  schedule:
    - cron: "30 20 * * *"   # täglich 20:30 UTC (tcgcsv aktualisiert ~20:00 UTC)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Archivtage pro Lauf nachladen"
        required: false
        default: "45"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"          # exakt gepinnt: reproduzierbare Läufe
          cache: pip

      - name: Abhängigkeiten installieren
        # requirements-optional.txt enthält py7zr/brotli. In Actions (Python
        # 3.12.7) existieren dafür Wheels; lokal auf sehr neuen Python-Versionen
        # nicht, deshalb sind sie in einer eigenen Datei.
        run: pip install -r requirements.txt -r requirements-optional.txt

      - name: Selbsttest der Bibliothek
        # Die Indexlogik wird täglich auf die komplette Historie angewandt.
        # Ein Fehler darin ist teurer als 30 Sekunden Testlauf.
        run: python -m pytest tests -q -x

      - name: Tagespreise abziehen (tcgcsv)
        run: python scripts/fetch_prices.py

      - name: CS2-Preise abziehen (Skinport)
        continue-on-error: true             # eine Klasse darf den Lauf nicht kippen
        run: python scripts/fetch_cs2.py

      - name: Marktdaten abziehen (Yahoo/Stooq)
        continue-on-error: true
        run: python scripts/fetch_markets.py

      - name: Historie nachladen (Archiv-Backfill)
        continue-on-error: true
        run: python scripts/backfill_archive.py --days ${{ github.event.inputs.backfill_days || 45 }}

      - name: Indizes berechnen + Website-Daten bauen
        run: python scripts/build_indices.py

      - name: Risikokennzahlen berechnen
        run: python scripts/build_risk.py

      - name: Potenzial-Screening berechnen
        run: python scripts/build_screening.py

      - name: Daten validieren (bricht bei Fehlern ab)
        run: python scripts/validate_data.py --strict

      - name: Tages-Newsletter versenden
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
        run: python scripts/send_newsletter.py --mode daily

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site/data site/newsletter
          git commit -m "Daten-Update $(date -u +%F)" || echo "nichts zu committen"
          # Der Bot und lokale Pushes kollidieren regelmäßig; erst rebasen,
          # dann pushen (vorher scheiterte der Push mit non-fast-forward).
          git pull --rebase --autostash origin main || true
          git push

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages veröffentlichen
        uses: actions/deploy-pages@v4

      - name: Fehlermeldung per E-Mail
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py "Täglicher Datenabzug fehlgeschlagen"
